name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (Node ${{ matrix.node }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.19.0"
            dependencies: locked
          - node: "24"
            dependencies: locked
          - node: "24"
            dependencies: latest-allowed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Resolve latest allowed dependencies
        if: matrix.dependencies == 'latest-allowed'
        run: npm update --ignore-scripts
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Package dry run
        run: npm run pack:dry
      - name: Retain failed real-Pi evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-evidence-${{ matrix.node }}-${{ matrix.dependencies }}
          path: ${{ runner.temp }}/fusion-upstream-*
          if-no-files-found: ignore
          retention-days: 7
